<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#004a9e">
<title>Picking Slip – Bajaj | METL Group</title>
<style>
  :root { --header:#004a9e; --blue:#0b4ea2; --yellow:#fed306; --bg:#eef3fa; --text:#1d2b3a; --muted:#5b6b7d; --border:#d5e1f0; --ok:#1f8a4c; --ok-soft:#e6f5ec; --warn:#7a5b00; --warn-soft:#fff6d6; --err:#c62828; --err-soft:#fdecec; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); padding-bottom:110px; }
  header { background:var(--header); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:5; }
  header .brand { font-weight:800; letter-spacing:.5px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  header .brand span.metl { color:var(--yellow); }
  header .sub { font-size:12px; opacity:.9; margin-top:2px; }
  main { max-width:820px; margin:0 auto; padding:14px 14px; }
  .card { background:#fff; border-radius:14px; box-shadow:0 4px 14px rgba(6,47,107,.08); padding:14px; margin-bottom:14px; }
  .card h2 { margin:0 0 12px; font-size:15px; color:var(--blue); }
  .grid2 { display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:560px) { .grid2 { grid-template-columns:1fr 1fr; } }
  label { display:block; font-size:12px; font-weight:700; color:var(--blue); margin-bottom:4px; }
  input, select { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--border); border-radius:10px; background:#fff; color:var(--text); }
  input:focus, select:focus { outline:2px solid var(--blue); outline-offset:1px; }
  .auto { background:#f4f6f9; color:var(--text); font-weight:600; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; min-height:16px; }
  .hint.err { color:var(--err); } .hint.ok { color:var(--ok); }
  .addrow { display:grid; grid-template-columns:1fr; gap:10px; align-items:end; }
  @media (min-width:640px) { .addrow { grid-template-columns:1.2fr 2fr 0.8fr 0.6fr; } }
  button { font:inherit; border:0; border-radius:10px; cursor:pointer; font-weight:700; padding:12px 16px; font-size:15px; }
  button.primary { background:var(--blue); color:#fff; }
  button.gold { background:var(--yellow); color:var(--blue); }
  button.ghost { background:#fff; color:var(--blue); border:2px solid var(--blue); }
  button.danger { background:#fff; color:var(--err); border:1px solid var(--err); padding:8px 10px; font-size:13px; }
  button.small { padding:8px 12px; font-size:13px; }
  button:disabled { opacity:.45; cursor:default; }
  .lines { display:grid; gap:10px; }
  .line { border:1px solid var(--border); border-left:6px solid var(--blue); border-radius:12px; padding:12px; background:#fff; }
  .line .top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .line .part { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:var(--blue); font-weight:700; }
  .line .name { font-weight:600; margin-top:2px; }
  .line .bin { font-size:12px; color:var(--muted); margin-top:3px; }
  .line .qtyrow { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .line .qtyrow input { width:110px; padding:8px 10px; }
  .empty { text-align:center; color:var(--muted); padding:22px 0; font-size:14px; }
  .status { display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .status.draft { background:var(--warn-soft); color:var(--warn); }
  .status.submitted { background:var(--ok-soft); color:var(--ok); }
  .status.new { background:#eef3fa; color:var(--blue); }
  .locked { background:var(--ok-soft); color:var(--ok); border-radius:12px; padding:12px; font-weight:600; margin-bottom:12px; display:none; }
  .locked.show { display:block; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:96px; background:#1d2b3a; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; display:none; max-width:90%; z-index:9; }
  .toast.show { display:block; }
  .footer { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--border); padding:10px 14px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); z-index:6; }
  .footer .inner { max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .footer .info { font-size:13px; color:var(--muted); }
  .footer .btns { display:flex; gap:10px; }
  .modebar { font-size:12px; background:#fff8dc; color:#7a5b00; padding:8px 12px; border-radius:10px; margin-bottom:12px; display:none; }
  .modebar.show { display:block; }
  .hidden { display:none !important; }
  .scanrow { display:flex; gap:8px; align-items:stretch; }
  .scanrow input { flex:1; min-width:0; }
  #camBox { display:none; margin-top:10px; border-radius:12px; overflow:hidden; background:#000; position:relative; }
  #camBox video { width:100%; display:block; max-height:320px; object-fit:cover; }
  #camBox .stop { position:absolute; right:8px; top:8px; }
</style>
</head>

<main>

  <section class="card">

<script>
  // ============================================================
  // Connection. Paste the Apps Script web app URL to go live.
  // Leave empty to preview the screens with sample data.
  // ============================================================
  // ============================================================
  // SET THESE TWO LINES after deploying the Apps Script web app.
  //   ENDPOINT  = the /exec URL from Deploy → Manage deployments
  //   SHEET_URL = the link to your Google Sheet (optional)
  // Until ENDPOINT is set, the page runs in demo mode (nothing saved).
  // ============================================================
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxVThr1xb_bcPM5J5x3IyhZEiygsK6XcjlN_8l3RoRO8Vi7YvzqlPGt7-7MMwxmaLkO/exec';
  const SHEET_URL = '';
  const LIVE = ENDPOINT.indexOf('https://script.google.com/macros/') === 0;

  // Sample data for preview only
  const DEMO = {
    lists: { rms: ['Vishnu','Prem','Jitender','Raju','Shahjehan','Nasim (WM)'],
             dse: ['Nickson','Shedrack','Magambo','Richard','Praygod','Rajabu','Marco','DSE UPC'],
             division: ['2W','3W','2W,3W'],
             pickers: ['Sebastian','Ibrahim','Ally','Elias','Shaibu'] },
    customers: { 'S10100': 'Arusha Arts Arusha', 'S10101': 'Kazimoto Dodoma', 'S10103': '100 % Spare Parts' },
    parts: { '52PF3348': ['HEAD LAMP WITH FOAM (HD with Grill)','AA-01-01-A'],
             'JE511230': ['CHAIN','AA-01-01-A'],
             'PF583029': ['Modular air filter element assembly','AA-01-01-A'],
             'DD111018': ['PLUG - SPARK (FOR CHAMPION P-RZ9HC)','B-01-02'],
             'PF551403': ['CLUTCH ASSEMBLY','D-03-01'],
             '36PF0010': ['KIT CHAIN SPROCKET BM150','AA-01-01-A'] }
  };

  const state = { slip: '', status: 'new', lines: [], locked: false };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---------- Data access ----------
  const NET_ERR = { ok:false, error:'Cannot reach the server. Check the connection and try again.' };
  async function get(params) {
    if (!LIVE) return demoGet(params);
    try {
      const res = await fetch(ENDPOINT + '?' + new URLSearchParams(params));
      return await res.json();
    } catch (e) { return NET_ERR; }
  }
  async function post(body) {
    if (!LIVE) return demoPost(body);
    try {
      const res = await fetch(ENDPOINT, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
      return await res.json();
    } catch (e) { return NET_ERR; }
  }
  function demoGet(p) {
    if (p.action === 'lists') return { ok:true, ...DEMO.lists };
    if (p.action === 'customer') return DEMO.customers[p.code] ? { ok:true, name: DEMO.customers[p.code] } : { ok:false, name:'' };
    if (p.action === 'part') { const x = DEMO.parts[p.no]; return x ? { ok:true, name:x[0], bin:x[1] } : { ok:false, name:'', bin:'' }; }
    return { ok:false };
  }
  function demoPost(b) {
    if (b.action === 'saveSlip') return { ok:true, slip: b.slip || 'PK-DEMO01' };
    if (b.action === 'submitSlip') return { ok:true, slip: b.slip, lines: b.lines.length };
    return { ok:true };
  }

  // ---------- Setup ----------
  function fillSelect(sel, items, placeholder) {
    sel.innerHTML = `<option value="">${placeholder}</option>` + items.map(v => `<option>${esc(v)}</option>`).join('');
  }
  async function init() {
    if (!LIVE) $('modebar').classList.add('show');
    if (SHEET_URL) { const a = $('sheetLink'); a.href = SHEET_URL; a.hidden = false; }
    const l = await get({ action:'lists' });
    if (!l.ok) toast(l.error || 'Could not load the drop-down lists. Reload the page.');
    fillSelect($('rms'), (l.ok && l.rms) || [], 'Select RMS');
    fillSelect($('dse'), (l.ok && l.dse) || [], 'Select DSE');
    fillSelect($('division'), (l.ok && l.division) || [], 'Select division');
    fillSelect($('picker'), (l.ok && l.pickers) || [], 'Select picker');
    renderLines();
  }

  // ---------- Lookups ----------
  let custTimer, partTimer, custSeq = 0, partSeq = 0;
  $('custCode').addEventListener('input', () => {
    clearTimeout(custTimer);
    custTimer = setTimeout(async () => {
      const code = $('custCode').value.trim();
      if (!code) { $('custName').value = ''; $('custHint').textContent = ''; return; }
      const seq = ++custSeq;
      const r = await get({ action:'customer', code });
      if (seq !== custSeq) return;
      $('custName').value = r.ok ? r.name : '';
      $('custHint').textContent = r.ok ? '' : (r.error || 'Customer code not found');
      $('custHint').className = 'hint ' + (r.ok ? 'ok' : 'err');
    }, 300);
  });

  $('partNo').addEventListener('input', () => {
    clearTimeout(partTimer);
    partTimer = setTimeout(lookupPart, 300);
  });
  async function lookupPart() {
    const no = cleanPart($('partNo').value);
    if (!no) { $('partName').value = ''; $('partBin').value = ''; $('partHint').textContent = ''; return; }
    const seq = ++partSeq;
    const r = await get({ action:'part', no });
    if (seq !== partSeq) return;
    $('partName').value = r.ok ? r.name : '';
    $('partBin').value = r.ok ? r.bin : '';
    $('partHint').textContent = r.ok ? '' : 'Part not in the Part List';
    $('partHint').className = 'hint ' + (r.ok ? 'ok' : 'err');
  }

  // ---------- Items ----------
  // ---------- Camera scanning (Chrome on Android) ----------
  let camStream = null, camTimer = null, lastScan = '', lastScanAt = 0;
  // Camera helpers
  async function openCamera() {
    if (!window.isSecureContext) {
      const e = new Error('insecure'); e.name = 'SecurityError'; throw e;
    }
    try {
      return await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
    } catch (err) {
      // Some phones reject the back-camera request; retry with any camera.
      if (['NotAllowedError', 'PermissionDeniedError', 'SecurityError', 'NotFoundError'].includes(err.name)) throw err;
      return await navigator.mediaDevices.getUserMedia({ video: true });
    }
  }
  function cameraErrorText(err) {
    const n = (err && err.name) || '';
    if (n === 'NotAllowedError' || n === 'PermissionDeniedError')
      return 'Camera permission is blocked. Tap the lock icon by the address bar, set Camera to Allow, then tap Scan again.';
    if (n === 'NotFoundError' || n === 'DevicesNotFoundError')
      return 'No camera was found on this phone. Type the part number instead.';
    if (n === 'NotReadableError' || n === 'TrackStartError')
      return 'The camera is in use by another app. Close that app and tap Scan again.';
    if (n === 'SecurityError')
      return 'The camera only works when the page is opened over https. Type the part number instead.';
    return 'The camera could not start (' + (n || 'unknown error') + '). Type the part number instead.';
  }

  $('scanBtn').addEventListener('click', async () => {
    if (!('BarcodeDetector' in window)) {
      toast('Camera scanning needs Chrome on Android. On other devices use a Bluetooth scanner.');
      return;
    }
    try {
      camStream = await openCamera();
      $('camVideo').srcObject = camStream;
      $('camBox').style.display = 'block';
      $('camMsg').textContent = 'Point the camera at the barcode and hold steady.';
      const detector = new BarcodeDetector({ formats: ['code_128', 'code_39', 'code_93', 'codabar', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'qr_code', 'data_matrix', 'pdf417'] });
      camTimer = setInterval(async () => {
        try {
          if ($('camVideo').readyState < 2) return;
          const codes = await detector.detect($('camVideo'));
          if (!codes.length) return;
          const v = cleanPart(codes[0].rawValue);
          if (v === lastScan && Date.now() - lastScanAt < 2000) return;
          lastScan = v; lastScanAt = Date.now();
          $('camMsg').textContent = 'Read: ' + v;
          $('partNo').value = v;
          $('partNo').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
        } catch (e) { $('camMsg').textContent = 'Scanner error: ' + (e.name || e) + '. Type the part number instead.'; }
      }, 400);
    } catch (err) {
      toast(cameraErrorText(err), 7000);
    }
  });
  function stopCamera() {
    clearInterval(camTimer);
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = null;
    $('camBox').style.display = 'none';
    $('partNo').focus();
  }
  $('camStop').addEventListener('click', stopCamera);

  // Adds a part to the slip. Returns true when the line was added.
  async function addPart(no, qty) {
    if (state.locked) { toast('This slip is submitted and locked.'); return false; }
    if (!no) return false;
    if (!(qty > 0)) { toast('Quantity must be more than zero.'); return false; }
    const r = await get({ action:'part', no });
    if (!r.ok) { toast(r.error === NET_ERR.error ? r.error : 'Part ' + no + ' is not in the Part List.'); return false; }
    const code = r.partNo || no;
    const existing = state.lines.find(l => l.part === code);
    if (existing) existing.qty += qty;
    else state.lines.push({ sr: state.lines.length + 1, part: code, name: r.name, bin: r.bin, qty });
    renderLines();
    toast('✓ ' + code + ' added · qty ' + (existing ? existing.qty : qty));
    return true;
  }
  function resetAddFields() {
    $('partNo').value = ''; $('partName').value = ''; $('partBin').value = '';
    $('partHint').textContent = ''; $('qty').value = 1;
    $('partNo').focus();
  }
  // A scanner sends the barcode followed by Enter: the item is added straight away
  $('partNo').addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const no = cleanPart($('partNo').value);
    const qty = parseInt($('qty').value, 10);
    if (await addPart(no, qty)) resetAddFields();
  });
  // Manual add button, same behaviour
  $('addBtn').addEventListener('click', async () => {
    const no = cleanPart($('partNo').value);
    const qty = parseInt($('qty').value, 10);
    if (!no) return toast('Scan or type a part number.');
    if (await addPart(no, qty)) resetAddFields();
  });
  $('qty').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('addBtn').click(); } });

  function renumber() { state.lines.forEach((l, i) => l.sr = i + 1); }

  function renderLines() {
    const box = $('lines');
    if (!state.lines.length) {
      box.innerHTML = '<div class="empty">No items yet. Add a part above.</div>';
    } else {
      box.innerHTML = state.lines.map(l => `
        <div class="line">
          <div class="top">
            <div>
              <div class="part">${esc(l.part)}</div>
              <div class="name">${esc(l.name)}</div>
              <div class="bin">📍 BIN ${esc(l.bin)}</div>
            </div>
            ${state.locked ? '' : `<button class="danger" data-del="${l.sr}" type="button">Delete</button>`}
          </div>
          <div class="qtyrow">
            <span style="font-size:13px;color:var(--muted)">Qty picked</span>
            <input type="number" min="1" value="${l.qty}" data-qty="${l.sr}" ${state.locked ? 'disabled' : ''} inputmode="numeric">
            ${state.locked ? '' : `<button class="small ghost" data-amend="${l.sr}" type="button">Update</button>`}
          </div>
        </div>`).join('');
    }
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteLine(+b.dataset.del));
    box.querySelectorAll('[data-amend]').forEach(b => b.onclick = () => amendLine(+b.dataset.amend));
    box.querySelectorAll('[data-qty]').forEach(inp => {
      inp.onchange = () => amendLine(+inp.dataset.qty);
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); amendLine(+inp.dataset.qty); } };
    });
    $('count').textContent = state.lines.length ? '(' + state.lines.length + ' lines)' : '';
    const totalQty = state.lines.reduce((a, l) => a + l.qty, 0);
    $('info').textContent = state.lines.length ? state.lines.length + ' lines · ' + totalQty + ' pieces' : 'No items yet';
    $('submitBtn').disabled = !state.lines.length || state.locked;
    ['custCode','rms','dse','division','picker'].forEach(id => { $(id).disabled = state.locked; });
    $('saveBtn').disabled = state.locked;
    $('addCard').classList.toggle('hidden', state.locked);
    $('slipNo').textContent = state.slip ? 'Slip ' + state.slip : '';
    $('lockedBar').classList.toggle('show', state.locked);
  }

  function deleteLine(sr) {
    if (state.locked) return;
    if (!confirm('Delete this line from the slip?')) return;
    state.lines = state.lines.filter(l => l.sr !== sr);
    renumber();
    renderLines();
    toast('Line deleted. Save the draft to keep the change.');
  }

  function amendLine(sr) {
    const input = document.querySelector(`[data-qty="${sr}"]`);
    const qty = parseInt(input.value, 10);
    if (!(qty > 0)) return toast('Quantity must be more than zero.');
    const line = state.lines.find(l => l.sr === sr);
    line.qty = qty;
    renderLines();
    toast('Quantity updated. Save the draft to keep the change.');
  }

  // ---------- Save and submit ----------
  function header() {
    return {
      customerCode: $('custCode').value.trim(), customerName: $('custName').value,
      rms: $('rms').value, dse: $('dse').value, division: $('division').value, picker: $('picker').value
    };
  }
  function validateHeader() {
    const h = header();
    if (!h.customerCode || !h.customerName) return 'Enter a valid customer code.';
    if (!h.rms || !h.dse || !h.division || !h.picker) return 'Choose RMS, DSE, division and picker.';
    return '';
  }

  $('saveBtn').addEventListener('click', async () => {
    const err = validateHeader();
    if (err) return toast(err);
    if (!state.lines.length) return toast('Add at least one item before saving.');
    $('saveBtn').disabled = true;
    const r = await post({ action:'saveSlip', slip: state.slip, header: header(),
      lines: state.lines.map(l => ({ part: l.part, qty: l.qty })) });
    $('saveBtn').disabled = false;
    if (!r.ok) return toast(r.error || 'Could not save.');
    state.slip = r.slip; state.status = 'draft';
    renderLines();
    toast('Draft saved · ' + state.slip);
  });

  $('submitBtn').addEventListener('click', async () => {
    const err = validateHeader();
    if (err) return toast(err);
    if (!state.lines.length) return toast('Add at least one item before submitting.');
    if (!confirm('Submit this slip? It will be locked after submitting.')) return;
    $('submitBtn').disabled = true;
    const r = await post({ action:'submitSlip', slip: state.slip, header: header(),
      lines: state.lines.map(l => ({ part: l.part, qty: l.qty })) });
    if (!r.ok) { renderLines(); return toast(r.error || 'Could not submit.'); }
    state.slip = r.slip || state.slip;
    state.status = 'submitted'; state.locked = true;
    renderLines();
    toast('Submitted ✓ ' + state.slip);
  });

  // ---------- Helpers ----------
  let toastTimer;
  // Keeps only the part number from a scanned label: 30151105-1_SKMURTNFPTETATK -> 30151105
  function cleanPart(v) {
    return String(v == null ? '' : v).trim().split(/[-_]/)[0].trim().toUpperCase();
  }
  function toast(msg, ms) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2600);
  }

  init();
</script>
</body>
</html>
